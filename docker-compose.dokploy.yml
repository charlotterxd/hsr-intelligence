# hsr-intelligence on the Dokploy VM (10.210.0.10).
#
# SEPARATE from ./docker-compose.yml on purpose. That file still drives the
# Windows-host deployment and is left untouched, so this migration cannot break
# the running service. Dokploy is pointed at this file via composePath.
#
# Differences from the Windows-host compose, all required rather than cosmetic:
#
#  * No source bind mounts. Dokploy re-clones the repo every deploy, giving each
#    path a new inode; bind-mounted source keeps pointing at the old orphaned
#    one and silently serves stale code.
#  * No `--reload` and no `npm run dev`. Code comes from the image; the backend
#    Dockerfile's own CMD is already correct for production.
#  * No published ports. Traefik routes by Host header on the shared
#    dokploy-network, so the stack needs no host ports at all.
#
# Routing, single hostname, no CORS:
#   hsr-intelligence.home/api/*  -> backend:8000   (higher priority)
#   hsr-intelligence.home/*      -> frontend:80

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEBUG: ${DEBUG:-False}
    networks:
      # dokploy-network: Traefik routes /api here, and Postgres lives here too.
      dokploy-network:
      # internal: stack-private, so nginx in the frontend can reach the backend
      # under a name that cannot collide. dokploy-network is shared by every
      # Dokploy stack and has no namespacing, so a generic `backend` alias is
      # not safe to proxy to.
      internal:
        aliases:
          - hsr-api
    labels:
      # Opt in to log collection. Alloy keeps only containers carrying
      # logs.collect=true, so nothing else on the VM is ingested.
      - logs.collect=true
      - logs.app=hsr-intelligence
      - traefik.enable=true
      - traefik.http.routers.hsr-backend.rule=Host(`hsr-intelligence.home`) && PathPrefix(`/api`)
      # Must outrank the frontend's catch-all, or /api would hit nginx.
      - traefik.http.routers.hsr-backend.priority=10
      - traefik.http.routers.hsr-backend.entrypoints=web
      - traefik.http.services.hsr-backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # No VITE_API_URL arg on purpose. The Dockerfile defaults it to empty,
      # which makes api.js use a relative, same-origin base -- the only way the
      # app works under both hsr-intelligence.home and a bare IP:port.
    restart: unless-stopped
    depends_on:
      - backend
    # Published so clients that cannot resolve `.home` -- phones above all, on
    # Wi-Fi and over Tailscale alike -- can reach the app by IP:port. Traefik
    # routes by Host header only, so a bare-IP request matches no router and
    # answers 404. This port bypasses Traefik entirely.
    #
    # Paired with a `netsh portproxy` entry on the Windows host, 8653 ->
    # 10.210.0.10:8653. That restores the pre-migration URL, which keeps
    # charlotterhub's url_wifi/url_tailscale entries correct with no edit.
    ports:
      - "8653:80"
    networks:
      - dokploy-network
      - internal
    labels:
      - logs.collect=true
      - logs.app=hsr-intelligence
      - traefik.enable=true
      - traefik.http.routers.hsr-frontend.rule=Host(`hsr-intelligence.home`)
      - traefik.http.routers.hsr-frontend.priority=1
      - traefik.http.routers.hsr-frontend.entrypoints=web
      - traefik.http.services.hsr-frontend.loadbalancer.server.port=80

networks:
  internal:
  dokploy-network:
    external: true
