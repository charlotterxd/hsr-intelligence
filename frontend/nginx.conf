server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reached two ways, and /api has to work on both:
    #   via Traefik (hsr-intelligence.home) -- Traefik routes /api to the
    #     backend on its own, so this block never sees those requests;
    #   via the published port (IP:8653) -- Traefik is bypassed entirely, so
    #     nginx must proxy /api itself.
    #
    # No trailing slash on proxy_pass: the backend's own routes are /api/*,
    # so the prefix must be preserved rather than stripped. `hsr-api` is an
    # alias on the stack-private `internal` network -- the shared
    # dokploy-network has no namespacing, so a generic name like `backend`
    # could resolve to another stack's container.
    location /api/ {
        proxy_pass http://hsr-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
