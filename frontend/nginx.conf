server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reached two ways, and /api has to work on both:
    #   via Traefik (hsr-intelligence.home) -- Traefik routes /api to the
    #     backend on its own, so this block never sees those requests;
    #   via the published port (IP:8653) -- Traefik is bypassed entirely, so
    #     nginx must proxy /api itself.
    #
    # No trailing slash on proxy_pass: the backend's own routes are /api/*,
    # so the prefix must be preserved rather than stripped. `hsr-api` is an
    # alias on the stack-private `internal` network -- the shared
    # dokploy-network has no namespacing, so a generic name like `backend`
    # could resolve to another stack's container.
    # Docker's embedded DNS, with the upstream held in a VARIABLE. Both parts
    # matter: given a literal hostname, nginx resolves the upstream exactly
    # once at startup and REFUSES TO START if it does not resolve --
    #   [emerg] host not found in upstream "hsr-api"
    # -- so a backend that is merely slow or briefly down wedges the frontend
    # in a permanent restart loop that does not recover once the backend
    # returns. That happened for real after the 2026-08-31 VM reboot: the
    # backend did not come back, and the frontend crash-looped behind it.
    # A variable defers resolution to request time, so the frontend now stays
    # up and simply 502s until the backend is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hsr_upstream http://hsr-api:8000;

    location /api/ {
        # No URI part on proxy_pass, so the original /api/... path is passed
        # through unchanged -- the backend's own routes are /api/*.
        proxy_pass $hsr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
